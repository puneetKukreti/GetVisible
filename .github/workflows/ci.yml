name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: 'true'
      NEXT_PUBLIC_DEMO_MODE: 'true'
      NEXTAUTH_SECRET: 'ci-only-not-a-real-secret-value'
      NEXTAUTH_URL: 'http://localhost:3000'
      ADMIN_PASSWORD: 'ci-only-owner-password'
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/ci?schema=public'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
